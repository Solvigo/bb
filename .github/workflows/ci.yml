name: CI

# Fleet-patched fork gate: typecheck + tests for packages touched by fleet PRs.
# Adapted from main's ci.yml — github-hosted runners only (no self-hosted labels),
# triggers scoped to fleet-patched so PRs against that branch get a real verdict.
on:
  push:
    branches:
      - fleet-patched
  pull_request:
    branches:
      - fleet-patched
  workflow_dispatch:

env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (ubuntu-latest, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: checks

      # Fleet-patched can carry stale committed template output; regenerate from
      # the built plugin SDK before typecheck/tests run their --check guards.
      - name: Regenerate template artifacts
        run: |
          pnpm exec turbo run build --filter=@bb/plugin-sdk --cache-dir=.turbo/cache --output-logs=new-only
          node packages/templates/scripts/generate-templates.mjs

      - name: Build, typecheck, and lint
        run: pnpm exec turbo run build typecheck lint --cache-dir=.turbo/cache --output-logs=new-only

      # Guards the JavaScript that blocks first paint in the web app. Heavy
      # editor, diff and math code reaches that path through barrel re-exports,
      # which typecheck and lint cannot see.
      - name: Check app boot-payload budget
        run: node apps/app/scripts/check-bundle-budget.mjs

  # Tests run on their own runners instead of inside the checks job: the big
  # suites are CPU-bound and previously fought each other (and the builds) for
  # the same 4 vCPUs, which made tests the critical path of every run.
  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            filter: --filter=@bb/server
            args: ""
          # @bb/app is the largest suite; Vitest splits by file and Turbo
          # hashes passthrough args, so each leg is a distinct cache entry.
          - shard: app-1
            filter: --filter=@bb/app
            args: -- --shard=1/3
          - shard: app-2
            filter: --filter=@bb/app
            args: -- --shard=2/3
          - shard: app-3
            filter: --filter=@bb/app
            args: -- --shard=3/3
          - shard: integration
            filter: --filter=@bb/integration-tests
            args: ""
          - shard: packages
            filter: --filter='!@bb/server' --filter='!@bb/app' --filter='!@bb/integration-tests'
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: test-${{ matrix.shard }}

      - name: Regenerate template artifacts
        run: |
          pnpm exec turbo run build --filter=@bb/plugin-sdk --cache-dir=.turbo/cache --output-logs=new-only
          node packages/templates/scripts/generate-templates.mjs

      - name: Test
        run: pnpm exec turbo run test ${{ matrix.filter }} --cache-dir=.turbo/cache --output-logs=new-only ${{ matrix.args }}

  package-smoke:
    name: Package Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: package-smoke

      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --cache-dir=.turbo/cache --output-logs=new-only
