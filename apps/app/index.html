<!doctype html>
<html lang="en" class="bb-app-shell-root">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <!-- iOS ignores the manifest's display mode, so these opt the home-screen
         app into standalone (chrome-less) launch. The translucent status bar
         and viewport-fit=cover let app surfaces paint edge-to-edge; layout
         chrome and overlays apply safe-area padding to their content. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Solvigo Airways" />
    <title>Solvigo Airways</title>
    <!-- The approved Airways app-icon tile. The generated 32px and 16px links
         below use the same source and remain the dynamic tint/badge targets. -->
    <link
      rel="icon"
      type="image/png"
      href="/brand/png/app-icon-mono-favicon-256.png?v=airways-tile-20260828"
      id="favicon-source"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=airways-brand-v3-20260827"
      id="favicon-32"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=airways-brand-v3-20260827"
      id="favicon-16"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
      id="apple-touch-icon"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      id="app-manifest"
      crossorigin="use-credentials"
    />
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function getFaviconColorSuffix() {
          try {
            var color = localStorage.getItem("bb.faviconColor");
            return /^(red|orange|yellow|green|teal|blue|purple|pink)$/.test(
              color,
            )
              ? "-" + color
              : "";
          } catch {
            return "";
          }
        }
        var faviconColorSuffix = getFaviconColorSuffix();
        document.getElementById("app-manifest").href =
          "/manifest" + faviconColorSuffix + ".webmanifest";
        document.getElementById("apple-touch-icon").href =
          "/apple-touch-icon" + faviconColorSuffix + ".png";
        // Pre-paint browser-chrome color so PWA/status-bar chrome doesn't
        // flash the wrong shade before the app boots; useTheme.ts owns the
        // meta tag afterwards. Mirrors the bb.theme preference resolution and
        // the --canvas values in theme.css (#181818 = oklch(0.209036 0 0)).
        var theme = localStorage.getItem("bb.theme");
        var darkTheme = theme === "dark" || (theme !== "light" && mq.matches);
        document.getElementById("theme-color").content = darkTheme
          ? "#181818"
          : "#ffffff";
      })();
    </script>
  </head>
  <body class="bb-app-shell">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
